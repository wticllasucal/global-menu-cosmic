[package]
name = "cosmic-global-menu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ui = ["dep:libcosmic"]

[[bin]]
name = "cosmic-global-menu"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
cosmic-global-menu-bridge = { path = "../bridge-server" }
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wayland-client = "0.31"
wayland-scanner = "0.31"
zbus = { version = "5", default-features = false, features = ["tokio"] }
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "e1f2cd2e52226aa50d59bb2cd6d43ffe290106ed", default-features = false, features = ["applet", "dbus-config", "tokio", "a11y"], optional = true }

[dev-dependencies]
serde_json = "1"
